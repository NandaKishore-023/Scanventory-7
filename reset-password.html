<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanventory - Reset Password</title>
    <link rel="stylesheet" href="css/login.css">
    <style>
        .reset-box {
            /* background: var(--bg-card); */
            background-color:#1E2638;
            border: 1px solid var(--border-color);
            padding: 40px;
            max-width: 100%;
            box-sizing: border-box;
            width: 380px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin: 100px auto;
        }

        
        .reset-box h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.749);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background: var(--bg-dark);
            color: var(--text-primary);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(246, 149, 0, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(246, 149, 0, 0.3);
        }

        .btn-secondary {
            background: var(--bg-sidebar);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
            transform: translateY(-1px);
            box-shadow: none;
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-message {
            color: var(--success);
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .password-requirements {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="reset-box">
        <h2>Reset Your Password</h2>

        <div id="newPasswordForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password">
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>

            <div class="password-requirements">
                Password must be at least 6 characters
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <button class="btn" onclick="handleResetPassword()">Update Password</button>
        </div>

        <div id="successView" style="display: none;">
            <div class="success-message" style="display: block;">
                Password updated successfully!
            </div>
            <button class="btn" onclick="window.location.href='login.html'">Go to Login</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script>
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const type = hashParams.get('type');

        console.log('Reset page loaded:', { type, hasToken: !!accessToken });

        async function handleResetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!newPassword || !confirmPassword) {
                errorDiv.textContent = 'Please fill in all fields';
                errorDiv.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                if (accessToken) {
                    await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: ''
                    });
                }

                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                document.getElementById('newPasswordForm').style.display = 'none';
                document.getElementById('successView').style.display = 'block';

                setTimeout(() => {
                    supabaseClient.auth.signOut();
                }, 1000);

            } catch (error) {
                console.error('Reset error:', error);
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        }

        if (!accessToken || type !== 'recovery') {
            document.getElementById('newPasswordForm').innerHTML = `
                <div class="error-message" style="display: block;">
                    Invalid or expired reset link. Please request a new password reset.
                </div>
                <button class="btn btn-secondary" onclick="window.location.href='login.html'">Back to Login</button>
            `;
        }
    </script>

</body>

</html>
