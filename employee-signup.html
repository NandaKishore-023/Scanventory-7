<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanventory - Employee Sign Up</title>
    <link rel="stylesheet" href="css/login.css">
    <style>
        .signup-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            width: 380px;
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin: 50px auto;
            box-sizing: border-box;
        }

        .signup-box h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.749);
        }

        .info-text {
            background: var(--bg-sidebar);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .info-text strong {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background: var(--bg-dark);
            color: var(--text-primary);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(246, 149, 0, 0.1);
        }

        .form-group input[readonly] {
            background: var(--bg-sidebar);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .form-group small {
            display: block;
            margin-top: 6px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(246, 149, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .links a:hover {
            color: var(--primary);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-message {
            color: var(--success);
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .password-requirements {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="signup-box">
        <h2>Complete Your Registration</h2>

        <div class="info-text" id="invitationInfo">
            Loading invitation details...
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" readonly>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" readonly>
        </div>

        <div class="form-group">
            <label>Employee ID</label>
            <input type="text" id="employeeId" readonly>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Choose a password">
            <div class="password-requirements">Minimum 6 characters</div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password">
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <button class="btn" onclick="completeSignup()">Create Account</button>

        <div class="links">
            <a href="login.html">Already have an account? Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script>
        function getBaseUrl() {
            const isLocalhost = window.location.hostname === 'localhost' ||
                window.location.hostname === '127.0.0.1';

            if (isLocalhost) {
                return 'http://localhost:5500';
            } else {
                return 'https://nandakishore-023.github.io/Scanventory-7';
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const employeeId = urlParams.get('employeeId');
        const name = urlParams.get('name');
        const orgId = urlParams.get('orgId');

        console.log('Signup params:', { email, employeeId, name });

        if (email && employeeId && name) {
            document.getElementById('fullName').value = decodeURIComponent(name);
            document.getElementById('email').value = decodeURIComponent(email);
            document.getElementById('employeeId').value = employeeId;
            document.getElementById('invitationInfo').innerHTML = `
                <strong>Welcome ${decodeURIComponent(name)}!</strong><br>
                Please set your password to complete registration.
            `;
        } else {
            document.getElementById('invitationInfo').innerHTML = 'Invalid or expired invitation link.';
            document.querySelector('button').disabled = true;
        }

        async function completeSignup() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!password || !confirmPassword) {
                errorDiv.textContent = 'Please enter and confirm your password';
                errorDiv.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                console.log('Creating account for:', { email, employeeId, name, orgId });

                const { data, error } = await supabaseClient.auth.signUp({
                    email: decodeURIComponent(email),
                    password: password,
                    options: {
                        data: {
                            full_name: decodeURIComponent(name),
                            employee_id: employeeId,
                            role: 'employee',
                            organization_id: orgId
                        },
                        emailRedirectTo: getBaseUrl()
                    }
                });

                if (error) throw error;

                console.log('Signup response:', data);

                const { error: updateError } = await supabaseClient
                    .from('invitations')
                    .update({ status: 'accepted' })
                    .eq('employee_id', employeeId)
                    .eq('organization_id', orgId);

                if (updateError) {
                    console.error('Error updating invitation:', updateError);
                }

                successDiv.textContent = 'Account created successfully! You can now login.';
                successDiv.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);

            } catch (error) {
                console.error('Signup exception:', error);
                errorDiv.textContent = error.message || 'An error occurred during signup';
                errorDiv.style.display = 'block';
            }
        }
    </script>

</body>

</html>
