<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanventory - Login</title>
    <link rel="stylesheet" href="css/login.css">
    
</head>

<body>

    <div class="login-box">
        <h2>Scanventory Login</h2>

        <div class="login-type">
            <button class="login-type-btn active" onclick="setLoginType('owner')">Owner Login</button>
            <button class="login-type-btn" onclick="setLoginType('employee')">Employee Login</button>
        </div>

        <div id="ownerLogin">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="ownerEmail" placeholder="Enter your email">
            </div>
        </div>

        <div id="employeeLogin" style="display: none;">
            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" id="employeeId" placeholder="Enter 10-digit employee ID" maxlength="10">
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="forgot-password">
            <a href="#" onclick="handleForgotPassword()">Forgot Password?</a>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <button class="btn" onclick="handleLogin()">Login</button>

        <div class="links">
            <a href="signup.html">Create Organization Account</a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="background: white; width: 400px; margin: 100px auto; padding: 30px; border-radius: 10px;">
            <h3 style="margin-top: 0;">Reset Password</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="resetEmail" placeholder="Enter your email">
            </div>
            <div id="resetMessage" class="error-message" style="display: none;"></div>
            <button class="btn" onclick="sendResetPassword()">Send Reset Link</button>
            <button class="btn" style="background: #95a5a6; margin-top: 10px;"
                onclick="closeForgotModal()">Cancel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>

    <script>


        function getBaseUrl() {
                const isLocalhost = window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1';

                if (isLocalhost) {
                    return 'http://localhost:5500';
                } else {
                    // For GitHub Pages with repository name
                    return 'https://nandakishore-023.github.io/Scanventory-7';
                }
            }


        let currentLoginType = 'owner';

        function setLoginType(type) {
            currentLoginType = type;

            // Update button styles
            document.querySelectorAll('.login-type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Show/hide appropriate login fields
            document.getElementById('ownerLogin').style.display = type === 'owner' ? 'block' : 'none';
            document.getElementById('employeeLogin').style.display = type === 'employee' ? 'block' : 'none';
        }

        async function handleLogin() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.style.display = 'none';

            if (!password) {
                errorDiv.textContent = 'Please enter password';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                if (currentLoginType === 'owner') {
                    // Owner login with email
                    const email = document.getElementById('ownerEmail').value;

                    if (!email) {
                        errorDiv.textContent = 'Please enter email';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    const { error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) throw error;

                    window.location.href = getBaseUrl() + '/index.html';  // Updated

                } else {
                    // Employee login with employee ID
                    const employeeId = document.getElementById('employeeId').value;

                    if (!employeeId || employeeId.length !== 10) {
                        errorDiv.textContent = 'Please enter valid 10-digit employee ID';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    // First get user by employee ID
                    const { data: profile, error: profileError } = await supabaseClient
                        .from('user_profiles')
                        .select('email')
                        .eq('employee_id', employeeId)
                        .single();

                    if (profileError || !profile) {
                        errorDiv.textContent = 'Invalid employee ID';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    // Then login with email and password
                    const { error } = await supabaseClient.auth.signInWithPassword({
                        email: profile.email,
                        password: password
                    });
                    
                    if (error) throw error;

                    window.location.href = getBaseUrl() + '/index.html';  // Updated
                }
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        }

        function handleForgotPassword() {
            document.getElementById('forgotModal').style.display = 'block';
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
            document.getElementById('resetEmail').value = '';
            document.getElementById('resetMessage').style.display = 'none';
        }

        async function sendResetPassword() {
            const email = document.getElementById('resetEmail').value;
            const messageDiv = document.getElementById('resetMessage');

            if (!email) {
                messageDiv.textContent = 'Please enter email';
                messageDiv.style.display = 'block';
                return;
            }

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: getBaseUrl() + '/reset-password.html',  // Updated
                });

                if (error) throw error;

                messageDiv.style.color = '#27ae60';
                messageDiv.textContent = 'Password reset link sent to your email!';
                messageDiv.style.display = 'block';

                setTimeout(closeForgotModal, 3000);
            } catch (error) {
                messageDiv.style.color = '#e74c3c';
                messageDiv.textContent = error.message;
                messageDiv.style.display = 'block';
            }
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('forgotModal');
            if (event.target === modal) {
                closeForgotModal();
            }
        }
    </script>

</body>

</html>
